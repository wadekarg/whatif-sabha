version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
      - chromadb:/app/chroma_db
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    command: npm run dev

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"   # Browser UI — http://localhost:7474
      - "7687:7687"   # Bolt protocol (used by Graphiti)
    environment:
      - NEO4J_AUTH=neo4j/whatif_sabha
    volumes:
      - neo4j_data:/data

volumes:
  uploads:
  chromadb:
  neo4j_data:
