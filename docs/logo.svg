<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100" role="img" aria-label="WhatIfSabha">
  <style>
    .whatif { fill: #1c1410; }
    .sabha  { fill: #c07820; }
    .brand  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 44px; letter-spacing: -0.02em; }
    @media (prefers-color-scheme: dark) {
      .whatif { fill: #f5f0e8; }
    }
  </style>
  <!-- Orange rounded-square badge -->
  <rect x="8" y="18" width="64" height="64" rx="16" fill="#c07820"/>
  <!-- Tapered spokes (width 3.24 at hub, 4.455 at outer tip) with rounded outer ends -->
  <g fill="#fef9c3">
    <path d="M 38.38 44 L 37.7725 28.2275 A 2.2275 2.2275 0 0 1 42.2275 28.2275 L 41.62 44 Z"/>
    <path d="M 38.38 44 L 37.7725 28.2275 A 2.2275 2.2275 0 0 1 42.2275 28.2275 L 41.62 44 Z" transform="rotate(45 40 50)"/>
    <path d="M 38.38 44 L 37.7725 28.2275 A 2.2275 2.2275 0 0 1 42.2275 28.2275 L 41.62 44 Z" transform="rotate(90 40 50)"/>
    <path d="M 38.38 44 L 37.7725 28.2275 A 2.2275 2.2275 0 0 1 42.2275 28.2275 L 41.62 44 Z" transform="rotate(135 40 50)"/>
    <path d="M 38.38 44 L 37.7725 28.2275 A 2.2275 2.2275 0 0 1 42.2275 28.2275 L 41.62 44 Z" transform="rotate(180 40 50)"/>
    <path d="M 38.38 44 L 37.7725 28.2275 A 2.2275 2.2275 0 0 1 42.2275 28.2275 L 41.62 44 Z" transform="rotate(225 40 50)"/>
    <path d="M 38.38 44 L 37.7725 28.2275 A 2.2275 2.2275 0 0 1 42.2275 28.2275 L 41.62 44 Z" transform="rotate(270 40 50)"/>
    <path d="M 38.38 44 L 37.7725 28.2275 A 2.2275 2.2275 0 0 1 42.2275 28.2275 L 41.62 44 Z" transform="rotate(315 40 50)"/>
  </g>
  <!-- Hollow hub + rim -->
  <g fill="none" stroke="#fef9c3">
    <circle cx="40" cy="50" r="6" stroke-width="3.24"/>
    <circle cx="40" cy="50" r="19" stroke-width="4.05"/>
  </g>
  <!-- Brand text: WhatIf (dark) + Sabha (orange) -->
  <text x="88" y="66" class="brand">
    <tspan class="whatif">WhatIf</tspan><tspan class="sabha">Sabha</tspan>
  </text>
</svg>
